<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haritha — Fresh Vegetables, Delivered</title>

    <meta name="description" content="Haritha delivers farm-fresh vegetables from the Ranga Reddy farms straight to your door, same day. Order tomatoes, spinach, ginger, and more — fresh, fast, and affordable." />
    <meta name="theme-color" content="#0F3D22" />
    <meta name="color-scheme" content="light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Haritha — Fresh Vegetables, Delivered" />
    <meta property="og:description" content="Farm-fresh vegetables from the Ranga Reddy farms, delivered to your door by evening." />
    <meta property="og:site_name" content="Haritha" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Haritha — Fresh Vegetables, Delivered" />
    <meta name="twitter:description" content="Farm-fresh vegetables, delivered same day." />

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%AC%3C/text%3E%3C/svg%3E" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      html, body { margin: 0; padding: 0; background: #FBF6E9; }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background:
          radial-gradient(circle at 18% -10%, rgba(255,255,255,.06), transparent 55%),
          linear-gradient(160deg, #0F3D22 0%, #0C3018 100%);
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      #boot-splash .bs-logo {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 32px;
        background: radial-gradient(circle at 32% 26%, #EFFFE8 0%, #1E8049 50%, #0F3D22 100%);
        box-shadow: inset 0 2px 3px rgba(255,255,255,.55), inset 0 -4px 7px rgba(0,0,0,.3), 0 10px 22px rgba(0,0,0,.4);
        border: 1px solid rgba(255,255,255,.22);
        animation: bsPulse 1.6s ease-in-out infinite;
      }
      #boot-splash .bs-name {
        font-family: 'Fraunces', serif;
        font-style: italic;
        font-weight: 700;
        font-size: 22px;
        color: #fff;
        letter-spacing: .01em;
      }
      #boot-splash .bs-sub {
        font-size: 12.5px;
        font-weight: 600;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: #BFE0CB;
      }
      #boot-splash .bs-bar {
        width: 120px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255,255,255,.16);
        overflow: hidden;
        margin-top: 6px;
      }
      #boot-splash .bs-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, #EFB23F, #E2622B);
        animation: bsSlide 1.2s ease-in-out infinite;
      }
      @keyframes bsPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes bsSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <div class="bs-logo">🥬</div>
        <div class="bs-name">Haritha</div>
        <div class="bs-sub">Fresh from the farm</div>
        <div class="bs-bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
